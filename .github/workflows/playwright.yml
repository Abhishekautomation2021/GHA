name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  playwright-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: lts/*
    
    - name: Install dependencies
      run: npm ci
    
    - name: Install http-server
      run: npm install -g http-server
    
    - name: Start application server
      run: http-server app -p 8081 --silent &
    
    - name: Wait for server to be ready
      run: npx wait-on http://localhost:8081 --timeout 15000
    
    - name: Install Playwright browsers
      run: npx playwright install --with-deps

    - name: Run Playwright tests
      run: npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

    - name: Upload blob report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: blob-report-${{ matrix.shardIndex }}
        path: blob-report
        retention-days: 1
    
    - name: Upload HTML report (individual shard)
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report-${{ matrix.shardIndex }}
        path: playwright-report
        retention-days: 1

  merge-reports:
    if: ${{ !cancelled() }}
    needs: playwright-tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: lts/*
    
    - name: Install dependencies
      run: npm ci
    
    - name: Download all blob reports
      uses: actions/download-artifact@v4
      with:
        path: all-blob-reports
        pattern: blob-report-*
    
    - name: Debug - Show directory structure
      run: |
        echo "=== Directory structure ==="
        find all-blob-reports -type f | head -20
        echo ""
        echo "=== Count files by type ==="
        find all-blob-reports -type f -name "*.jsonl" | wc -l
        echo "JSONL files found above"
    
    - name: Merge reports (with error handling)
      run: |
        mkdir -p blob-reports
        if find all-blob-reports -name "*.jsonl" -type f | head -1 | grep -q .; then
          find all-blob-reports -name "*.jsonl" -type f -exec cp {} blob-reports/ \;
          npx playwright merge-reports --reporter html ./blob-reports
        else
          echo "No .jsonl files found, trying alternative merge..."
          npx playwright merge-reports --reporter html ./all-blob-reports || true
        fi
    
    - name: Upload merged HTML report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: html-report-merged
        path: playwright-report
        retention-days: 30