name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  playwright-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: lts/*
    
    - name: Install dependencies
      run: npm ci
    
    - name: Install http-server
      run: npm install -g http-server
    
    - name: Start application server
      run: http-server app -p 8081 --silent &
    
    - name: Wait for server to be ready
      run: npx wait-on http://localhost:8081 --timeout 15000
    
    - name: Install Playwright browsers
      run: npx playwright install --with-deps

    - name: Run Playwright tests
      run: npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

    - name: Upload blob report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: blob-report-${{ matrix.shardIndex }}
        path: blob-report
        retention-days: 1
    
    - name: Upload HTML report (individual shard)
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report-${{ matrix.shardIndex }}
        path: playwright-report
        retention-days: 1

  merge-reports:
    if: ${{ !cancelled() }}
    needs: playwright-tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: lts/*
    
    - name: Install dependencies
      run: npm ci
    
    - name: Download all blob reports
      uses: actions/download-artifact@v4
      with:
        path: all-blob-reports
        pattern: blob-report-*
    
    - name: Extract and merge blob reports
      run: |
        mkdir -p blob-reports
        
        echo "=== Extracting ZIP files and flattening ==="
        counter=1
        find all-blob-reports -type f -name "*.zip" | sort | while read zipfile; do
          echo "Extracting: $zipfile"
          unzip -q -o "$zipfile" -d temp-extract/
          # Rename each report.jsonl to report-{n}.jsonl to avoid conflicts
          mv temp-extract/report.jsonl "blob-reports/report-$counter.jsonl"
          counter=$((counter + 1))
        done
        rm -rf temp-extract
        
        echo ""
        echo "=== Files in blob-reports (flattened) ==="
        ls -la blob-reports/
        
        echo ""
        echo "=== Running merge with default output ==="
        npx playwright merge-reports --reporter html blob-reports
        
        echo ""
        echo "=== Checking for playwright-report ==="
        if [ -d "playwright-report" ]; then
          echo "✓ playwright-report found!"
          ls -la playwright-report/
        else
          echo "✗ playwright-report NOT found"
        fi
    
    - name: Verify report exists before upload
      if: always()
      run: |
        echo "=== Final check before upload ==="
        if [ -f "playwright-report/index.html" ]; then
          echo "✓ Report ready to upload"
          du -sh playwright-report/
        else
          echo "✗ No index.html found!"
          ls -R playwright-report/ || echo "Directory doesn't exist"
        fi
    
    - name: Upload HTML report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: html-report-merged
        path: playwright-report
        retention-days: 30
    
    - name: Print Report Location
      if: ${{ !cancelled() }}
      run: |
        echo "=========================================="
        echo "✓ Test execution completed!"
        echo "=========================================="
        echo ""
        echo "📊 REPORTS AVAILABLE:"
        echo "1. Merged HTML Report: html-report-merged"
        echo "   - View in: Actions > Artifacts > html-report-merged"
        echo ""
        echo "2. Individual Shard Reports:"
        echo "   - playwright-report-1"
        echo "   - playwright-report-2"
        echo "   - playwright-report-3"
        echo "   - playwright-report-4"
        echo ""
        echo "=========================================="